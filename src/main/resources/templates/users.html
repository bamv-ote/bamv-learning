<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link th:href="@{/webjars/bootstrap/5.2.3/css/bootstrap.min.css}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <title th:text="Users"></title>
</head>
<body>
<span th:replace="~{header :: header}"></span>
<main class="container">
    <div class="row">
        <div class="col-md-2"></div>
        <div class="col-md-8">
            <h3>ユーザー一覧</h3>
            <div class="card mb-3" th:each="user : ${userList}">
                <div class="row g-0">
                    <div class="col-md-2 d-flex align-items-center justify-content-center">
                        <img class="m-2" src="../img/icon_basic.png" alt="img" width="60" height="60">
                    </div>
                    <div class="col-md-10">
                        <div class="card-body">
                            <h5 class="card-title" style="margin-bottom: 10px;">
                                <span class="card-text" th:text="${user.name}"></span>
                            </h5>
<!--                                <a class="btn btn-primary btn-sm">フォロー</a>-->
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-2"></div>
    </div>
</main>
</body>
</html>
