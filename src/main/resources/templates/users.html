<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link th:href="@{/webjars/bootstrap/5.2.3/css/bootstrap.min.css}" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
    <title>ユーザー</title>
</head>
<body>
<span th:replace="~{header :: header}"></span>
<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h3 class="mb-3">ユーザー</h3>
            <div th:each="user : ${users}" class="card mb-3">
                <div class="row g-0">
                    <div class="col-md-2 d-flex align-items-center justify-content-center">
                        <span style="font-size: 100px" class="material-icons">person</span>
                    </div>
                    <div class="col-md-10">
                        <div class="card-body">
                            <h5 class="card-title">
                                <a th:href="@{/userprofile(username=${user.name})}" th:text="${user.name}"></a>
                            </h5>
                            <div>
                                <form th:action="@{/users/toggleFollow}" method="post">
                                    <input type="hidden" name="targetUserId" th:value="${user.userId}"/>
                                    <input type="hidden" name="page" th:value="${page}"/>
                                    <button type="submit" class="btn btn-primary" th:text="${user.following} ? 'unfollow' : 'follow'"></button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <nav aria-label="Page navigation example">
                <ul class="pagination">
                    <li class="page-item">
                        <th:block th:if="${page > 1}">
                            <a class="page-link" th:href="@{/users(page=${page - 1})}">前へ</a>
                        </th:block>
                        <th:block th:if="${page <= 1}">
                            <a class="page-link" href="#">前へ</a>
                        </th:block>
                    </li>
                    <li class="page-item">
                        <a class="page-link" th:href="@{/users(page=${page})}" th:text="${page}"></a>
                    </li>
                    <li class="page-item">
                        <a class="page-link" th:href="@{/users(page=${page + 1})}" th:text="${page + 1}"></a>
                    </li>
                    <li class="page-item">
                        <a class="page-link" th:href="@{/users(page=${page + 2})}" th:text="${page + 2}"></a>
                    </li>
                    <li class="page-item">
                        <a class="page-link" th:href="@{/users(page=${page + 1})}">次へ</a>
                    </li>
                </ul>
            </nav>

        </div>
    </div>
</main>
</body>
</html>
