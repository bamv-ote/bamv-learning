<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link th:href="@{/webjars/bootstrap/5.2.3/css/bootstrap.min.css}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <title>Users</title>
</head>
<body>
<span th:replace="~{header :: header}"></span>
    <div class="d-flex justify-content-center align-items-center flex-column col-12">
        <h1>Users</h1>
        <div class="col-md-10">
            <div th:each="user : ${usersList}" class="d-flex col-md-9">
                <div class="col-3">
                    <span style="font-size: 100px" class="material-icons">person</span>
                </div>
                <div class="col-9">
                    <a th:text=${user.name}></a>
                    <button class="btn btn-primary">
                        follow
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
