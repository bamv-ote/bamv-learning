<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link th:href="@{/webjars/bootstrap/5.2.3/css/bootstrap.min.css}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <title>Users</title>
</head>
<body>
    <span th:replace="~{header :: header}"></span>
    <div class="col-12 d-flex justify-content-center">
        <div class="d-flex justify-content-center col-10">
            <!--ページのメイン要素-->
            <div class="col-8 d-flex flex-column align-items-start">
                <h1 class="mb-3">Users</h1>
                <!-- userのコンテナ-->
                <div class="col-md-6 d-flex flex-column align-items-start">
                    <div th:each="user : ${usersList}" class="border d-flex col-12 justify-content-center align-items-center">
                        <div class="col-12 d-flex justify-content-center" >
                            <!--icon-->
                            <span style="font-size: 100px" class="material-icons col-3">person</span>
                            <!-- 名前とリンク-->
                            <div class="d-flex flex-column col-9 justify-content-center">
                                <a th:text=${user.name} th:href="@{/user/{id}(id=${user.userId})}"></a>
                                <form method="post" action="follow">
                                    <input type="hidden" name="followedId" th:value="${user.userId}" />
                                    <!--ボタン-->
                                    <button class="btn btn-primary mt-1 col-3" type="submit"
                                            th:disabled="${#lists.contains(followedList,user.userId)}">
                                        <span th:text="${#lists.contains(followedList,user.userId)? 'フォロー中' : 'フォロー'} "></span>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
